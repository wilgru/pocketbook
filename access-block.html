<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access denied — Pocketbook</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #f1f5f9; /* slate-100 */
        color: #334155; /* slate-700 */
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      .card {
        background: #ffffff;
        border: 1px solid #cbd5e1; /* slate-300 */
        border-radius: 0.5rem;
        box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.07);
        padding: 2rem 1.5rem;
        max-width: 22rem;
        width: 100%;
      }

      .title {
        font-size: 2.25rem; /* text-4xl */
        font-weight: 400;
        letter-spacing: -0.025em;
        color: #334155;
        margin-bottom: 1.5rem;
        line-height: 1.1;
      }

      .divider {
        border: none;
        border-top: 1px solid #e2e8f0; /* slate-200 */
        margin-bottom: 1.5rem;
      }

      .icon {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 50%;
        background-color: #fee2e2; /* red-100 */
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1rem;
      }

      .icon svg {
        width: 1.25rem;
        height: 1.25rem;
        stroke: #ef4444; /* red-500 */
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .heading {
        font-size: 1rem;
        font-weight: 500;
        color: #334155;
        margin-bottom: 0.5rem;
      }

      .body-text {
        font-size: 0.875rem; /* text-sm */
        color: #64748b; /* slate-500 */
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="title">Pocketbook</h1>
      <hr class="divider" />
      <div class="icon">
        <!-- Lock icon -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <p class="heading">Access denied</p>
      <p class="body-text">
        You don't have permission to access this application. Sign in with an
        authorised Cloudflare account to continue.
      </p>
    </div>
  </body>
</html>
